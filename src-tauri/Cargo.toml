[package]
name = "teachya"
version = "0.1.0"
description = "Learn languages from whatever is on your screen."
edition = "2021"
rust-version = "1.77"

[lib]
name = "teachya_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder", "NSRunningApplication", "NSWorkspace", "NSApplication", "NSGraphics"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }
keyring = { version = "3", features = ["apple-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time"] }
base64 = "0.22"

# Optimize dependencies even in dev so screenshot encoding is not painfully slow.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
